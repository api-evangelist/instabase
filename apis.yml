aid: instabase
name: Instabase
description: >-
  Instabase is an agentic automation platform that transforms complex,
  document-heavy workflows using AI. Its AI Hub product uses large language
  models and packet-aware AI agents to extract, classify, validate, and
  reason over unstructured document packets (PDFs, images, spreadsheets,
  emails, scans, and more), turning them into structured, verifiable
  intelligence. AI Hub exposes a REST API and Python SDK for creating file
  batches, running automation apps and production deployments, reading and
  writing workspace files, and managing secrets, with industry solutions for
  financial services, insurance, healthcare, and the public sector.
  Instabase is venture-backed (a16z, Greylock, Index Ventures).
